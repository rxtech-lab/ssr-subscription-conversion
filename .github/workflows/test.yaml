name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "MIHOMO_BIN=$(scripts/download-mihomo.sh)" >> "$GITHUB_ENV"

      - name: Test
        run: bunx vitest run

      - name: Type check
        run: bunx tsc --noEmit
